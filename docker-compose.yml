services:
  # ==========================================
  # 1. DATABASE SERVICES
  # ==========================================
  mysql:
    image: mysql:8.0
    container_name: 4viewsocial_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: 4view_social
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - social_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7.0
    container_name: 4viewsocial_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - social_net

  # ==========================================
  # 2. LARAVEL BACKEND SERVICES
  # ==========================================
  auth_service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: 4viewsocial_auth
    restart: unless-stopped
    environment:
      PORT: 8001
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: 4view_social
      DB_USERNAME: root
      DB_PASSWORD: ""
    ports:
      - "8001:8001"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./auth-service:/var/www/html
      - /var/www/html/vendor
    networks:
      - social_net

  admin_service:
    build:
      context: ./4ViewsSocial_API_Admin
      dockerfile: Dockerfile
    container_name: 4viewsocial_admin
    restart: unless-stopped
    environment:
      PORT: 8003
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: 4view_social
      DB_USERNAME: root
      DB_PASSWORD: ""
    ports:
      - "8003:8003"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./4ViewsSocial_API_Admin:/var/www/html
      - /var/www/html/vendor
    networks:
      - social_net

  timeline_service:
    build:
      context: ./timeline-service
      dockerfile: Dockerfile
    container_name: 4viewsocial_timeline
    restart: unless-stopped
    environment:
      PORT: 8004
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: 4view_social
      DB_USERNAME: root
      DB_PASSWORD: ""
    ports:
      - "8004:8004"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./timeline-service:/var/www/html
      - /var/www/html/vendor
    networks:
      - social_net

  # ==========================================
  # 3. NODE.JS BACKEND SERVICES
  # ==========================================
  chat_service:
    build:
      context: ./chat-service
      dockerfile: Dockerfile
    container_name: 4viewsocial_chat
    restart: unless-stopped
    environment:
      PORT: 8002
      MONGO_URI: mongodb://mongo:27017/4viewsocial_chat
    ports:
      - "8002:8002"
    depends_on:
      - mongo
    volumes:
      - ./chat-service:/app
      - /app/node_modules
    networks:
      - social_net

  gateway_service:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: 4viewsocial_gateway
    restart: unless-stopped
    environment:
      PORT: 4000
      FRONTEND_ORIGIN: http://localhost:5173
      AUTH_SERVICE_URL: http://auth_service:8001
      CHAT_SERVICE_URL: http://chat_service:8002
      ADMIN_SERVICE_URL: http://admin_service:8003
      POST_SERVICE_URL: http://timeline_service:8004
    ports:
      - "4000:4000"
    depends_on:
      - auth_service
      - admin_service
      - timeline_service
      - chat_service
    volumes:
      - ./api-gateway:/app
      - /app/node_modules
    networks:
      - social_net

  # ==========================================
  # 4. FRONTEND CLIENT
  # ==========================================
  client_service:
    build:
      context: ./4viewsocial_client
      dockerfile: Dockerfile
    container_name: 4viewsocial_client
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - gateway_service
    volumes:
      - ./4viewsocial_client:/app
      - /app/node_modules
    networks:
      - social_net

volumes:
  mysql_data:
  mongo_data:

networks:
  social_net:
    driver: bridge
